    description: "Cinematic dark abstract background with subtle deep cyan and blue glowing lights, resembling a premium smart TV standby screen"
    aspect_ratio: "16:9"

notes:
  - Using generated hooks from @workspace/api-client-react
  - Assuming the backend CORS proxies the URLs for the /api/detect endpoint
