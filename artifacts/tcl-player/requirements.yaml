packages:
  "hls.js": "Required for playing HLS (.m3u8) video streams natively in the browser"
  "zustand": "Lightweight global state management for the player and playlist"
  "framer-motion": "Smooth cinematic animations and transitions for the TV interface"
  "clsx": "Utility for constructing className strings conditionally"
  "tailwind-merge": "Utility to cleanly merge Tailwind classes"

images:
